<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#d35400">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>주택 방문</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root { --main:#d35400; --bg:#f4f4f6; --card:#fff; --text:#222; --sub:#777; --line:#e3e3e8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); font-size:16px; }
  header { position:sticky; top:0; z-index:5; background:var(--main); color:#fff; padding:12px 16px; display:flex; gap:8px; align-items:center; }
  header h1 { font-size:18px; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header button, header label { background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:8px; padding:8px 10px; font-size:14px; cursor:pointer; white-space:nowrap; }
  main { padding:12px 16px 80px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border-radius:12px; padding:12px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  input, select, textarea { width:100%; font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea { min-height:80px; resize:vertical; }
  .row { display:flex; gap:8px; align-items:center; }
  .btn { border:0; border-radius:8px; padding:10px 14px; font:inherit; font-size:15px; cursor:pointer; background:#eee; color:var(--text); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:4px; }
  .btn.primary { background:var(--main); color:#fff; }
  .btn.sm { padding:6px 10px; font-size:13px; }
  .btn:disabled { opacity:.35; cursor:default; }
  .filters { display:grid; grid-template-columns:3fr 2fr; gap:6px; margin:8px 0; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:16px; padding:10px 0; font:inherit; font-size:15px; cursor:pointer; flex:1; }
  .chip.on { background:var(--main); color:#fff; border-color:var(--main); }
  .house { display:flex; gap:8px; align-items:center; }
  .house .info { flex:1; min-width:0; cursor:pointer; }
  .house .name { font-weight:600; }
  .house .meta { font-size:13px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bldg { font-size:14px; font-weight:600; margin:14px 2px 6px; color:#555; }
  .bldg small { font-weight:400; color:var(--sub); }
  .icon { width:44px; height:44px; border-radius:50%; font-size:20px; padding:0; flex:none; }
  .badge { display:inline-block; font-size:12px; padding:2px 6px; border-radius:10px; background:#eee; color:var(--sub); margin-left:4px; font-weight:400; }
  .badge.done { background:#e6f4ea; color:#1e7e34; }
  .badge.warn { background:#fdecea; color:#c0392b; }
  .notice { background:#fff4e5; color:#8a4b00; border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:8px; display:flex; gap:8px; align-items:center; }
  .notice span { flex:1; }
  .notice button { background:none; border:0; font-size:16px; color:inherit; cursor:pointer; }
  #detail { position:fixed; inset:0; background:var(--bg); z-index:10; overflow-y:auto; display:none; }
  .photos { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .slot { border:2px dashed var(--line); border-radius:10px; aspect-ratio:4/3; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--sub); cursor:pointer; overflow:hidden; position:relative; background:#fafafa; }
  .slot img { width:100%; height:100%; object-fit:cover; }
  .slot .tag { position:absolute; top:4px; left:4px; background:rgba(0,0,0,.55); color:#fff; font-size:12px; padding:2px 6px; border-radius:8px; }
  .slotBtns { display:flex; gap:4px; margin-top:4px; }
  .slotBtns .btn { flex:1; }
  .empty { text-align:center; color:var(--sub); padding:40px 0; }
  .muted { color:var(--sub); font-size:13px; }
</style>
</head>
<body>

<header>
  <h1>주택 방문</h1>
  <label>엑셀 불러오기<input type="file" id="file" accept=".xlsx" hidden></label>
  <button id="exportBtn">내보내기</button>
  <button id="addBtn" aria-label="집 추가">＋</button>
</header>

<main>
  <div class="notice" id="installHint" hidden><span>📌 브라우저 메뉴에서 <b>홈 화면에 추가</b>로 열면 기록이 더 안전하게 보관돼요.</span><button id="hintClose" aria-label="닫기">✕</button></div>
  <input id="search" type="search" placeholder="이름 · 번호 · 주소 검색">
  <div class="filters">
    <select id="road"></select>
    <select id="filter">
      <option value="all">전체</option><option value="todo">미방문</option>
      <option>방문완료</option><option>설치완료</option><option>부재</option><option>거절</option>
      <option value="photo">사진 있음</option>
    </select>
  </div>
  <div class="row" id="phoneChips" style="margin-bottom:8px"></div>
  <div id="list"></div>
</main>

<section id="detail"></section>

<script>
// 화면에는 이름·연락처·주소만 보이고, 나머지 열(수급·장애유형 등)은 숨겨서 저장했다가 내보낼 때만 엑셀에 넣는다.
// 모든 데이터와 사진은 이 폰 안(IndexedDB)에만 저장되고 서버로 보내지 않는다.
const STATUSES = ['방문완료', '설치완료', '부재', '거절'];
const EXTRA = ['방문상태', '방문일시', '부재횟수', '메모', '사진1', '사진2', '고유키'];
const LIST_STEP = 200;
const PHOTO_MAX = 1280; // 사진 긴 변 픽셀 (한 장 약 150KB)

// ---------- 저장소 ----------
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('house-app', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('photos'); };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function idb(store, mode, fn) {
  const d = await dbp;
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode), req = fn(tx.objectStore(store));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
  });
}
// rows: { id, v:[원본 열 값...], st:방문상태, at:방문일시, ab:부재횟수, memo, p1, p2:사진 유무, mt:마지막 수정, ex:마지막 내보내기 }
let S = { cols: [], rows: [] };
let byId = new Map(), IX = {};
async function save() {
  try { await idb('kv', 'readwrite', s => s.put(S, 'data')); }
  catch (e) { alert('저장 실패: 폰 저장공간을 확인해주세요.\n' + e); }
}
const photoKey = (id, n) => id + '|' + n;
const getPhoto = (id, n) => idb('photos', 'readonly', s => s.get(photoKey(id, n)));
const touch = r => { r.mt = new Date().toISOString(); };
const unsaved = r => r.mt && (!r.ex || r.mt > r.ex);

// ---------- 유틸 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const coll = new Intl.Collator('ko', { numeric: true });
function normPhone(v) {
  let d = String(v ?? '').replace(/\D/g, '');
  if (/^1\d{8,9}$/.test(d)) d = '0' + d; // 엑셀이 숫자로 저장해 앞자리 0이 빠진 경우
  return d.length >= 8 && d.length <= 12 ? d : '';
}
const fmtPhone = d => /^02/.test(d) ? d.replace(/^(02)(\d{3,4})(\d{4})$/, '$1-$2-$3') : d.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso), p = n => String(n).padStart(2, '0');
  return isNaN(d) ? String(iso) : `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function setIX() {
  const ci = re => S.cols.findIndex(c => re.test(c));
  IX = { name: ci(/이름|성명/), phone: ci(/연락처|전화|휴대/), addr: ci(/전체주소/), road: ci(/도로명/) };
  if (IX.addr < 0) IX.addr = ci(/주소/);
  if (IX.road < 0) IX.road = IX.addr;
}
const val = (r, k) => IX[k] >= 0 ? (r.v[IX[k]] ?? '') : '';
// 건물: "강서구 화곡로68길136-27" → "화곡로68길136-27" (앞에 붙은 "서울특별시", "강서구"는 뗌)
const bldgOf = r => String(val(r, 'road')).replace(/\s/g, '').replace(/^(서울특별시|서울시|서울)?[가-힣]{1,3}구(?=[가-힣])/, '');
// 골목: "화곡로68길136-27" → "화곡로68길"
const roadOf = r => { const a = bldgOf(r); return (a.match(/^(.*(?:로|길))\d/) || [, a])[1]; };
const addrHead = r => String(val(r, 'addr')).split(',')[0].trim();               // "화곡로68길 136-27"
const addrTail = r => String(val(r, 'addr')).split(',').slice(1).join(',').trim(); // "202호 (화곡동)"
const nameOf = r => val(r, 'name') || '(이름 없음)';
const phoneOf = r => normPhone(val(r, 'phone'));
const sortRows = () => S.rows.sort((a, b) => coll.compare(bldgOf(a), bldgOf(b)) || coll.compare(val(a, 'addr'), val(b, 'addr')));

// ---------- 엑셀 불러오기 ----------
async function importFile(f) {
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(await f.arrayBuffer());
  const ws = wb.worksheets[0];
  const head = [];
  for (let c = 1; c <= ws.columnCount; c++) head.push(ws.getRow(1).getCell(c).text.trim());
  const keep = head.map((h, i) => i).filter(i => !EXTRA.includes(head[i]));
  if (!S.cols.length) { S.cols = keep.map(i => head[i]); setIX(); }
  if (IX.name < 0 || IX.addr < 0) { S.cols = []; return alert('"이름"과 "주소" 열을 찾지 못했어요. 첫 줄 열 제목을 확인해주세요.'); }
  // 열 제목으로 맞추고, 제목 없는 열은 위치로 맞춤
  const map = S.cols.map((h, j) => h ? head.indexOf(h) : (keep[j] ?? -1));
  const ext = name => head.indexOf(name);
  const cell = (row, i) => i < 0 ? '' : row.getCell(i + 1).text.trim();

  const seen = new Map();
  let added = 0, same = 0;
  ws.eachRow((row, rn) => {
    if (rn === 1) return;
    const v = map.map(i => cell(row, i));
    if (!v.some(Boolean)) return;
    if (IX.phone >= 0) v[IX.phone] = normPhone(v[IX.phone]) || v[IX.phone];
    // 같은 주소·이름이 여러 줄이면 #2, #3 … 으로 구분
    let id = cell(row, ext('고유키'));
    if (!id) {
      const base = v[IX.addr] + '|' + v[IX.name], n = (seen.get(base) || 0) + 1;
      seen.set(base, n);
      id = n > 1 ? base + '#' + n : base;
    }
    const st = cell(row, ext('방문상태')), at = cell(row, ext('방문일시')), memo = cell(row, ext('메모')), ab = +cell(row, ext('부재횟수')) || 0;
    const ex = byId.get(id);
    if (ex) { // 앱에 이미 있으면 앱 기록이 우선, 비어 있는 것만 채움
      if (!ex.st && st) { ex.st = st; ex.at = at; }
      if (!ex.memo && memo) ex.memo = memo;
      if (!ex.ab && ab) ex.ab = ab;
      same++; return;
    }
    const r = { id, v, st, at, ab, memo, p1: false, p2: false, manual: id.startsWith('a:') };
    S.rows.push(r); byId.set(id, r); added++;
  });

  // 이 앱에서 내보낸 엑셀이면 사진도 되살림 (앱에 이미 있는 사진은 그대로 둠)
  let restored = 0;
  const P1 = ext('사진1'), KEY = ext('고유키');
  if (P1 >= 0 && KEY >= 0) for (const im of ws.getImages()) {
    const n = im.range.tl.nativeCol - P1 + 1; if (n !== 1 && n !== 2) continue;
    const r = byId.get(cell(ws.getRow(im.range.tl.nativeRow + 1), KEY));
    if (!r || r['p' + n]) continue;
    const m = wb.getImage(+im.imageId);
    const blob = new Blob([m.buffer], { type: 'image/' + (m.extension || 'jpeg') });
    const bmp = await createImageBitmap(blob);
    await idb('photos', 'readwrite', s => s.put({ blob, w: bmp.width, h: bmp.height }, photoKey(r.id, n)));
    r['p' + n] = true; restored++;
  }
  sortRows(); await save(); renderRoads(); resetList();
  alert(`불러오기 완료\n새로 ${added}집 · 이미 있던 ${same}집` + (restored ? `\n사진 ${restored}장 복원` : '') + `\n전체 ${S.rows.length.toLocaleString()}집`);
}
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { await importFile(f); } catch (err) { alert('엑셀을 읽지 못했어요: ' + err.message); }
  e.target.value = '';
};

// ---------- 엑셀 내보내기 (지금 보이는 목록 전체, 숨긴 열 + 사진 포함) ----------
const blobToDataURL = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
$('#exportBtn').onclick = async () => {
  const list = filtered();
  if (!list.length) return alert('내보낼 집이 없어요.');
  const nPhoto = list.reduce((n, r) => n + r.p1 + r.p2, 0);
  if (!confirm(`지금 목록 ${list.length.toLocaleString()}집 (사진 ${nPhoto}장)을 엑셀로 내보낼까요?` +
    (nPhoto > 300 ? `\n\n사진이 많아 파일이 커요(약 ${Math.round(nPhoto * 0.15)}MB). 골목별로 나눠 내보내는 걸 추천해요.` : ''))) return;
  const btn = $('#exportBtn'); btn.disabled = true;
  try {
    const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet('방문');
    const P = S.cols.length + EXTRA.indexOf('사진1'); // 사진1 열 (0부터 셈)
    const M = S.cols.length + EXTRA.indexOf('메모');
    ws.addRow([...S.cols, ...EXTRA]).font = { bold: true };
    ws.columns.forEach((c, i) => c.width = i === IX.addr ? 28 : i === P || i === P + 1 ? 22 : i === M ? 30 : 12);
    for (let i = 0; i < list.length; i++) {
      const r = list[i];
      const row = ws.addRow([...r.v, r.st || '', fmtDate(r.at), r.ab || '', r.memo || '', '', '', r.id]);
      if (!r.p1 && !r.p2) continue;
      row.height = 95; // 약 127px
      btn.textContent = `사진 ${i + 1}/${list.length}`;
      for (const n of [1, 2]) {
        const p = r['p' + n] && await getPhoto(r.id, n); if (!p) continue;
        const k = Math.min(150 / p.w, 120 / p.h); // 칸 안에 비율 유지
        const img = wb.addImage({ base64: await blobToDataURL(p.blob), extension: 'jpeg' });
        ws.addImage(img, { tl: { col: P + n - 1 + 0.05, row: i + 1 + 0.05 }, ext: { width: Math.round(p.w * k), height: Math.round(p.h * k) }, editAs: 'oneCell' });
      }
    }
    btn.textContent = '파일 만드는 중…';
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = `주택방문_${fmtDate(new Date().toISOString()).slice(0, 10)}${$('#road').value ? '_' + $('#road').value : ''}.xlsx`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    const now = new Date().toISOString();
    list.forEach(r => r.ex = now);
    await save(); renderList();
  } catch (e) { alert('내보내기 실패: ' + e.message); }
  btn.disabled = false; btn.textContent = '내보내기';
};

// ---------- 목록 ----------
let shown = LIST_STEP;
const resetList = () => { shown = LIST_STEP; renderList(); };
$('#search').oninput = resetList;
$('#road').onchange = resetList;
$('#filter').onchange = resetList;

function renderRoads() {
  const g = new Map(), sel = $('#road'), cur = sel.value;
  for (const r of S.rows) { const k = roadOf(r); if (!g.has(k)) g.set(k, [0, 0]); const x = g.get(k); x[0]++; if (r.st) x[1]++; }
  sel.innerHTML = `<option value="">전체 골목 (${g.size})</option>` +
    [...g].sort((a, b) => coll.compare(a[0], b[0])).map(([k, [n, d]]) => `<option value="${esc(k)}">${esc(k)} (${d}/${n})</option>`).join('');
  sel.value = cur;
}
// 번호 있음 / 없음 체크 버튼 ('' = 전체)
let phoneF = '';
$('#phoneChips').onclick = e => {
  const b = e.target.closest('[data-ph]'); if (!b) return;
  phoneF = phoneF === b.dataset.ph ? '' : b.dataset.ph; resetList();
};
function filtered(ignorePhone) {
  const road = $('#road').value, f = $('#filter').value;
  const q = $('#search').value.trim().toLowerCase(), qd = q.replace(/\D/g, '');
  return S.rows.filter(r => {
    if (road && roadOf(r) !== road) return false;
    if (!ignorePhone && phoneF && (phoneF === 'has') !== !!phoneOf(r)) return false;
    if (f === 'todo' && r.st) return false;
    if (f === 'photo' && !r.p1 && !r.p2) return false;
    if (STATUSES.includes(f) && r.st !== f) return false;
    if (!q) return true;
    return (qd.length >= 3 && phoneOf(r).includes(qd)) || ['name', 'addr', 'road'].some(k => String(val(r, k)).toLowerCase().includes(q));
  });
}
const stBadge = r => (r.st ? `<span class="badge ${/완료/.test(r.st) ? 'done' : 'warn'}">${esc(r.st)}</span>` : '') +
  (r.ab && r.st !== '부재' ? `<span class="badge warn">부재 ${r.ab}</span>` : r.ab > 1 ? `<span class="badge warn">${r.ab}회</span>` : '');
function renderList() {
  if (!S.rows.length) { $('#phoneChips').innerHTML = ''; $('#list').innerHTML = `<div class="empty">오른쪽 위 <b>엑셀 불러오기</b>로<br>주택 명단을 넣어주세요.</div>`; return; }
  const all = filtered(true), nHas = all.filter(phoneOf).length;
  $('#phoneChips').innerHTML = [['has', `📞 번호 있음 ${nHas.toLocaleString()}`], ['none', `번호 없음 ${(all.length - nHas).toLocaleString()}`]]
    .map(([k, t]) => `<button class="chip ${phoneF === k ? 'on' : ''}" data-ph="${k}">${phoneF === k ? '✔ ' : ''}${t}</button>`).join('');
  const list = filtered(), done = list.filter(r => r.st).length, un = S.rows.filter(unsaved).length;
  const perB = new Map(); for (const r of list) perB.set(bldgOf(r), (perB.get(bldgOf(r)) || 0) + 1);
  let prev = null;
  $('#list').innerHTML =
    (un ? `<div class="notice"><span>⚠ 아직 내보내지 않은 기록 <b>${un}집</b> — 하루 일 끝나면 <b>내보내기</b>로 엑셀을 받아 두세요.</span></div>` : '') +
    `<p class="muted">${list.length.toLocaleString()}집 · 방문기록 ${done.toLocaleString()}집${list.length > shown ? ` · ${shown}집까지 표시 (골목을 고르거나 검색해 좁혀보세요)` : ''}</p>` +
    list.slice(0, shown).map(r => {
      const ph = phoneOf(r), pc = r.p1 + r.p2, b = bldgOf(r);
      const h = b !== prev ? `<div class="bldg">🏠 ${esc(addrHead(r))} <small>${perB.get(b)}집</small></div>` : '';
      prev = b;
      return h + `<div class="card house">
        <div class="info" data-open="${esc(r.id)}">
          <div class="name">${esc(nameOf(r))}${stBadge(r)}${pc ? `<span class="badge">📷 ${pc}</span>` : ''}</div>
          <div class="meta">${esc(addrTail(r) || val(r, 'addr'))}</div>
          <div class="meta">${ph ? fmtPhone(ph) : '번호 없음'}${r.memo ? ' · ' + esc(r.memo) : ''}</div>
        </div>
        ${ph ? `<a class="btn icon" href="tel:${ph}" aria-label="전화">📞</a>` : ''}
      </div>`;
    }).join('') + (list.length > shown ? `<button class="btn" id="more" style="width:100%">${LIST_STEP}집 더 보기</button>` : '');
}
$('#list').onclick = e => {
  if (e.target.id === 'more') { shown += LIST_STEP; return renderList(); }
  const t = e.target.closest('[data-open]'); if (t) openDetail(t.dataset.open);
};

// ---------- 상세 ----------
let current = null, urls = [];
function openDetail(id) { current = id; renderDetail(); $('#detail').style.display = 'block'; $('#detail').scrollTop = 0; history.pushState({ d: 1 }, ''); }
function closeDetail() { current = null; $('#detail').style.display = 'none'; urls.forEach(URL.revokeObjectURL); urls = []; sortRows(); renderRoads(); renderList(); }

// 명단에 없는 집 직접 추가 (고른 골목이 있으면 주소에 미리 채움)
$('#addBtn').onclick = () => {
  if (!S.cols.length) return alert('먼저 엑셀 명단을 불러와 주세요.');
  const v = S.cols.map(() => ''), road = $('#road').value;
  if (road) { v[IX.addr] = road + ' '; v[IX.road] = road; }
  const r = { id: 'a:' + Date.now().toString(36), v, st: '', at: '', ab: 0, memo: '', p1: false, p2: false, manual: true };
  touch(r); S.rows.unshift(r); byId.set(r.id, r); save();
  openDetail(r.id); setTimeout(() => $('#mName')?.focus(), 50);
};
window.onpopstate = () => { if (current) closeDetail(); };

// 사진을 줄이고 오른쪽 아래에 "찍은 날짜 · 건물 주소" 도장 (이름·번호는 안 넣음)
async function shrink(file, stamp) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, PHOTO_MAX / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  const g = cv.getContext('2d');
  g.drawImage(bmp, 0, 0, cv.width, cv.height);
  let fs = Math.round(Math.max(cv.width, cv.height) / 32);
  g.font = `bold ${fs}px sans-serif`;
  const tw = g.measureText(stamp).width, room = cv.width * 0.94;
  if (tw > room) { fs = Math.floor(fs * room / tw); g.font = `bold ${fs}px sans-serif`; }
  g.textAlign = 'right'; g.textBaseline = 'bottom';
  g.lineWidth = Math.max(2, fs / 6); g.strokeStyle = 'rgba(0,0,0,.8)'; g.fillStyle = '#ffeb3b';
  const x = cv.width - fs * 0.5, y = cv.height - fs * 0.5;
  g.strokeText(stamp, x, y); g.fillText(stamp, x, y);
  const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.75));
  return { blob, w: cv.width, h: cv.height };
}

async function renderDetail() {
  const r = byId.get(current); if (!r) return;
  urls.forEach(URL.revokeObjectURL); urls = [];
  const ph = phoneOf(r);
  const pics = await Promise.all([1, 2].map(n => r['p' + n] ? getPhoto(r.id, n) : null));
  const slot = n => {
    const p = pics[n - 1], u = p && URL.createObjectURL(p.blob); if (u) urls.push(u);
    return `<div>
      <label class="slot"><span class="tag">사진${n}</span>${u ? `<img src="${u}" alt="사진${n}">` : '📷<br>찍기'}
        <input type="file" accept="image/*" data-photo="${n}" hidden></label>
      ${u ? `<div class="slotBtns"><a class="btn sm" href="${u}" target="_blank">크게</a><button class="btn sm" data-pdel="${n}">삭제</button></div>` : ''}
    </div>`;
  };
  // 지도: 건물 주소만 카카오맵으로 보냄 (이름·번호는 안 보냄)
  const map = `https://map.kakao.com/link/search/${encodeURIComponent(addrHead(r))}`;
  $('#detail').innerHTML = `
    <header><button id="back">←</button><h1>${esc(nameOf(r))}</h1></header>
    <main>
      ${r.manual ? `<div class="card">
        <label class="muted">직접 추가한 집 — 이름</label><input id="mName" value="${esc(val(r, 'name'))}" placeholder="이름">
        <label class="muted">연락처</label><input id="mPhone" type="tel" inputmode="tel" value="${ph ? fmtPhone(ph) : ''}" placeholder="010-0000-0000">
        <label class="muted">주소</label><input id="mAddr" value="${esc(val(r, 'addr'))}" placeholder="화곡로68길 18, 301호">
      </div>` : ''}
      <div class="card">
        <div style="font-weight:600">${esc(val(r, 'addr'))}</div>
        ${r.manual ? '' : !ph || r.pa
          ? `<label class="muted" style="display:block;margin-top:8px">📱 전화번호 ${ph ? '(앱에서 추가함)' : '없음 — 알게 되면 입력하세요'}</label>
             <input id="addPhone" type="tel" inputmode="tel" value="${ph ? fmtPhone(ph) : ''}" placeholder="010-0000-0000">`
          : `<div style="margin-top:4px">${fmtPhone(ph)}</div>`}
        <div class="row" style="margin-top:8px">
          ${addrHead(r) ? `<a class="btn" style="flex:1" href="${map}" target="_blank" rel="noopener">🗺 지도</a>` : ''}
          ${ph ? `<a class="btn primary" style="flex:1" href="tel:${ph}">📞 전화</a>` : ''}
        </div>
      </div>
      <div class="card">
        <div class="row">${STATUSES.map(s => `<button class="chip ${r.st === s ? 'on' : ''}" data-st="${s}">${s}${s === '부재' && r.ab ? ' ' + r.ab : ''}</button>`).join('')}</div>
        ${r.at || r.ab ? `<div class="row muted" style="margin-top:6px"><span style="flex:1">${r.at ? fmtDate(r.at) + ' 기록' : ''}${r.ab ? ` · 부재 ${r.ab}회` : ''}</span>
          ${r.ab ? '<button class="btn sm" id="abMinus">부재 −1</button>' : ''}</div>` : ''}
      </div>
      <div class="card"><div class="photos">${slot(1)}${slot(2)}</div></div>
      <div class="card">
        <label class="muted">메모</label>
        <textarea id="memo" placeholder="특이사항">${esc(r.memo)}</textarea>
      </div>
      ${r.manual ? '<button class="btn" id="mDelete" style="width:100%;color:#c0392b">이 집 삭제</button>' : ''}
    </main>`;
  // 번호 없는 집: 번호를 넣으면 원래 연락처 열에 저장 (내보내기 엑셀에도 들어감)
  if ($('#addPhone')) $('#addPhone').onchange = e => {
    const raw = e.target.value.trim(), p = normPhone(raw);
    if (raw && !p) return alert('전화번호를 다시 확인해주세요.');
    r.v[IX.phone] = p; r.pa = !!p; touch(r); save(); renderDetail();
  };
  if (r.manual) {
    const setV = (k, v) => { r.v[IX[k]] = v; touch(r); save(); };
    $('#mName').onchange = e => { setV('name', e.target.value.trim()); renderDetail(); };
    $('#mPhone').onchange = e => {
      const raw = e.target.value.trim(), p = normPhone(raw);
      if (raw && !p) return alert('전화번호를 다시 확인해주세요.');
      setV('phone', p); renderDetail();
    };
    $('#mAddr').onchange = e => {
      const a = e.target.value.trim();
      r.v[IX.addr] = a;
      if (IX.road !== IX.addr) r.v[IX.road] = a.split(',')[0].replace(/\s/g, ''); // 골목·건물 묶음용
      touch(r); save(); renderDetail();
    };
    $('#mDelete').onclick = async () => {
      if (!confirm(`${nameOf(r)} 집과 사진을 삭제할까요?`)) return;
      await idb('photos', 'readwrite', s => { s.delete(photoKey(r.id, 1)); s.delete(photoKey(r.id, 2)); });
      S.rows = S.rows.filter(x => x !== r); byId.delete(r.id); await save(); history.back();
    };
  }
  $('#back').onclick = () => history.back();
  // 부재는 누를 때마다 횟수가 쌓이고, 나머지는 한 번 더 누르면 해제
  $('#detail').querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
    const s = b.dataset.st;
    if (s === '부재') { r.ab = (r.ab || 0) + 1; r.st = s; }
    else r.st = r.st === s ? '' : s;
    r.at = r.st ? new Date().toISOString() : '';
    touch(r); save(); renderDetail();
  });
  if ($('#abMinus')) $('#abMinus').onclick = () => {
    r.ab--; if (!r.ab && r.st === '부재') { r.st = ''; r.at = ''; }
    touch(r); save(); renderDetail();
  };
  $('#memo').onchange = e => { r.memo = e.target.value.trim(); touch(r); save(); };
  $('#detail').querySelectorAll('[data-photo]').forEach(inp => inp.onchange = async () => {
    const f = inp.files[0], n = +inp.dataset.photo; if (!f) return;
    try {
      const p = await shrink(f, `${fmtDate(new Date().toISOString())} · ${addrHead(r)}`);
      await idb('photos', 'readwrite', s => s.put(p, photoKey(r.id, n)));
      r['p' + n] = true; touch(r); await save(); renderDetail();
    } catch (e) { alert('사진 저장 실패: ' + e.message); }
  });
  $('#detail').querySelectorAll('[data-pdel]').forEach(b => b.onclick = async () => {
    const n = +b.dataset.pdel;
    if (!confirm(`사진${n}을 삭제할까요?`)) return;
    await idb('photos', 'readwrite', s => s.delete(photoKey(r.id, n)));
    r['p' + n] = false; touch(r); await save(); renderDetail();
  });
}

// ---------- 홈 화면 추가 안내 (아이폰은 홈 화면 앱이 아니면 오래 안 쓴 사이트 데이터를 지울 수 있음) ----------
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let hintOff = false; try { hintOff = localStorage.getItem('hintOff') === '1'; } catch (e) {}
$('#installHint').hidden = standalone || hintOff;
$('#hintClose').onclick = () => { $('#installHint').hidden = true; try { localStorage.setItem('hintOff', '1'); } catch (e) {} };

// 전파 없는 곳에서도 열리게 앱 파일을 폰에 보관
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

(async () => {
  const d = await idb('kv', 'readonly', s => s.get('data'));
  if (d) S = d;
  setIX(); sortRows(); byId = new Map(S.rows.map(r => [r.id, r]));
  navigator.storage?.persist?.(); // 공간 부족 시 브라우저가 임의로 지우지 않게 요청
  renderRoads(); renderList();
})().catch(e => alert('데이터를 불러오지 못했어요: ' + e));
</script>
</body>
</html>
